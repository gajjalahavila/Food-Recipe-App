<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Foodie</title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body>


    <main class="auth-page">

        <div class="auth-card">

            <a
                href="index.html"
                class="logo auth-logo">

                🍴 Foodie

            </a>


            <h1>
                Create Account
            </h1>


            <p class="auth-subtitle">
                Join Foodie and discover delicious recipes.
            </p>


            <form id="signupForm">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="signupName"
                    placeholder="Enter your name"
                    required>


                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    required>


                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    minlength="6"
                    required>


                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="6"
                    required>


                <button
                    type="submit"
                    class="primary-btn">

                    Create Account

                </button>

            </form>


            <p
                id="signupMessage"
                class="message">
            </p>


            <p class="switch-auth">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


            <p class="switch-auth">

                <a href="index.html">
                    ← Back to Home
                </a>

            </p>

        </div>

    </main>


    <script>

        const signupForm =
            document.getElementById("signupForm");


        const signupMessage =
            document.getElementById("signupMessage");


        signupForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const name =
                    document.getElementById(
                        "signupName"
                    ).value.trim();


                const email =
                    document.getElementById(
                        "signupEmail"
                    ).value.trim();


                const password =
                    document.getElementById(
                        "signupPassword"
                    ).value;


                const confirmPassword =
                    document.getElementById(
                        "confirmPassword"
                    ).value;


                if (password !== confirmPassword) {

                    signupMessage.textContent =
                        "Passwords do not match.";

                    signupMessage.style.color =
                        "red";

                    return;

                }


                const user = {

                    name: name,

                    email: email,

                    password: password

                };


                localStorage.setItem(
                    "user",
                    JSON.stringify(user)
                );


                signupMessage.textContent =
                    "Account created successfully!";

                signupMessage.style.color =
                    "green";


                setTimeout(function () {

                    window.location.href =
                        "login.html";

                }, 1000);

            }
        );

    </script>

</body>

</html>
